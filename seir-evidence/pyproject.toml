[project]
name = "seir-evidence"
version = "0.1.0"
description = "SEIR Evidence Service: Git/config/runtime evidence and grounded explanations"
requires-python = ">=3.11"
# Dependencies are added phase by phase, only when a phase actually needs them.
dependencies = [
    "pydantic>=2.6,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit discovery: only `app` is code; data/ and workspace/ are generated folders.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
